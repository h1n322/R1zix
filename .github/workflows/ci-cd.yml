name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Restore dependencies
        run: dotnet restore RiskMate.MathEngine/RiskMate.MathEngine.sln
        
      - name: Build
        run: dotnet build RiskMate.MathEngine/RiskMate.MathEngine.sln --configuration Release --no-restore
        
      - name: Run Tests
        run: dotnet test RiskMate.MathEngine/RiskMate.MathEngine.sln --configuration Release --no-build --verbosity normal

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /home/opc/riskmate
            git fetch origin main
            git reset --hard origin/main
            docker compose build --parallel=false
            docker compose up -d
